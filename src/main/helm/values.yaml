nameOverride: null # uses the release name if not set

image:
  repository: docker-registry.timtrense.com/tim/alertmanager-graphmail-forwarder
  pullPolicy: IfNotPresent
  tag: null # default to the .Chart.AppVersion

imagePullSecrets: []

replicaCount: 1

# base labels for all resources (null = autogenerate)
labels:
  app.kubernetes.io/name: alertmanager-graphmail-forwarder
# base annotations for all resources (null = autogenerate)
annotations: null

deployment:
  nameOverride: null
  # additional labels for the deployment
  labels: {}
  # selector labels for the deployment (null = use pod.labels)
  selectorLabels: null

pod:
  # additional labels for the pod
  labels:
    app.kubernetes.io/component: app
  # additional annotations for the pod
  annotations: {}
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  portOverride: null # {name, number} defaults to http/8080 or https/8443 depending on tls.enabled
  env: []
  # additional envFrom sources, if .configEnabled, otherwise the only ones
  envFrom: []
  containerSecurityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  additionalContainers: []

  resources:
    limits:
      cpu: 100m
      memory: 60Mi
    requests:
      cpu: 10m
      memory: 60Mi

service:
  enabled: true
  nameOverride: null
  labels: {}
  annotations: {}
  type: ClusterIP
  portOverride: null # {name, number} defaults to https/443 or http/80 depending on tls.enabled
  selectorLabels: null # defaults to pod.labels if not set

tls:
  # whether to mount the specified TLS secret into the pod and thus switch to HTTPS
  # Hint: you will likely want to change the ports spec accordingly:
  #       - pod.port.name to https
  #       - pod.port.number to 8443
  #       - service.port.name to https
  #       - service.port.number to 443
  enabled: false
  # a type=kubernetes.io/tls secret containing the TLS tls.crt and tls.key for HTTPS
  secretName: alertmanager-graphmail-forwarder-tls
  certManager:
    # if you want, this helm chart can request a TLS certificate via cert-manager
    # the CN will be the service's DNS name within the cluster
    enabled: false
    issuer:
      name: alertmanager-graphmail-forwarder-ca
      kind: Issuer
      # whether to deploy that issuer as well. it will be a CAIssuer with a self-signed CA certificate
      enabled: true
      caCertificate:
        name: alertmanager-graphmail-forwarder-ca
        # whether to deploy that CA secret as well
        enabled: true
        commonNameOverride: null
        labels: {}
        annotations: {}
        duration: 876000h # 100 years
        issuer:
          name: alertmanager-graphmail-forwarder-selfsigned
          kind: Issuer
          # whether to deploy that self-signed issuer as well
          enabled: true
          labels: {}
          annotations: {}
          spec:
            selfSigned: {}
      labels: {}
      annotations: {}

    certificate:
      nameOverride: null
      labels: {}
      annotations: {}
      # additional dns names. The common name will always be added automatically.
      dnsNames: []
      # defaults to the service name (see #service.nameOverride)
      commonNameOverride: null
      duration: 24h
      renewBefore: 5% # use % as a suffix if you like: see https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.CertificateSpec


config:
  # whether to generate appropriate configmaps and secrets. Otherwise,
  # pod.env, pod.envFrom, pod.volumes and pod.volumeMounts must be used together
  # with preexisting configmaps/secrets to provide configuration.
  enabled: true
  nameOverride: null
  labels: {}
  annotations: {}
  # the actual application configuration, as plain values
  values:
    to: ["recipient@example.com"] # required
    from: "sender@example.com" # required
    clientId: "your-client-id" # required
    tenantId: "your-tenant-id" # required
    clientSecret: "your-client-secret" # required
    authToken: "authorization-bearer-token" # required
  additionalValues: {}
