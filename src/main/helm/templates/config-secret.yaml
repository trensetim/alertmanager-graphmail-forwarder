{{- if .Values.config.enabled }}
apiVersion: v1
kind: Secret
metadata:
  {{- if .Values.config.nameOverride }}
  name: {{ .Values.config.nameOverride }}
  {{- else }}
  name: {{ include "name" . }}
  {{- end -}}

  {{- "" }}
  labels:
    {{- toYaml (merge (default dict .Values.config.labels) (default dict .Values.labels)) | nindent 4 }}

  {{- $annotations := merge (default dict .Values.config.annotations) (default dict .Values.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end -}}

{{- "" }}
type: Opaque
stringData:
  TO: "{{ join "," .Values.config.values.to }}"
  FROM: "{{ .Values.config.values.from }}"
  TENANT_ID: "{{ .Values.config.values.tenantId }}"
  CLIENT_ID: "{{ .Values.config.values.clientId }}"
  CLIENT_SECRET: "{{ .Values.config.values.clientSecret }}"
  AUTH_TOKEN: "{{ .Values.config.values.authToken }}"
  LOG_LEVEL: "{{ upper (default "INFO" .Values.config.values.logLevel) }}"
  SUBJECT_TAGS: "{{ join "," (default (list) .Values.config.values.subjectTags) }}"
  PROMETHEUS_NAMING_STRICT: "{{ ternary "true" "false" .Values.config.values.prometheusNamingStrict }}"
  {{- if .Values.config.values.deadman.disabled }}
  DEADMAN_DISABLED: "true"
  {{- end }}
  DEADMAN_INTERVAL: "{{ .Values.config.values.deadman.interval }}"
  {{- if .Values.config.values.deadman.forwarderSubject }}
  DEADMAN_FORWARDER_SUBJECT: "{{ .Values.config.values.deadman.forwarderSubject }}"
  {{- end }}
  {{- if .Values.config.values.deadman.alertmanagerSubject }}
  DEADMAN_ALERTMANAGER_SUBJECT: "{{ .Values.config.values.deadman.alertmanagerSubject }}"
  {{- end }}
  DEADMAN_FORWARDER_AT_START: "{{ ternary "true" "false" .Values.config.values.deadman.forwarderAtStart }}"
  DEADMAN_FORWARDER_INTERVAL: "{{ .Values.config.values.deadman.forwarderInterval }}"
  DEADMAN_ALERTMANAGER_TIMEOUT: "{{ .Values.config.values.deadman.alertmanagerTimeout }}"
  DEADMAN_ALERTMANAGER_INTERVAL: "{{ .Values.config.values.deadman.alertmanagerInterval }}"
  DEADMAN_ALERTMANAGER_INHIBITION_ALERT_LABEL_FILTER: "{{ range $k, $v := .Values.config.values.deadman.alertmanagerInhibitionAlertLabelFilter }}{{ $k }}={{ $v }},{{ end }}"
  {{- with .Values.config.values.additionalSecretValues }}
  {{- toYaml . | nindent 2 }}
  {{- end}}
{{- end }}
