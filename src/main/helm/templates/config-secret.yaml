{{- if .Values.config.enabled }}
apiVersion: v1
kind: Secret
metadata:
  {{- if .Values.config.nameOverride }}
  name: {{ .Values.config.nameOverride }}
  {{- else }}
  name: {{ include "name" . }}
  {{- end -}}

  {{- "" }}
  labels:
    {{- toYaml (merge (default dict .Values.config.labels) (default dict .Values.labels)) | nindent 4 }}

  {{- $annotations := merge (default dict .Values.config.annotations) (default dict .Values.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end -}}

{{- "" }}
type: Opaque
stringData:
  TO: "{{ join "," .Values.config.values.to }}"
  FROM: "{{ .Values.config.values.from }}"
  TENANT_ID: "{{ .Values.config.values.tenantId }}"
  CLIENT_ID: "{{ .Values.config.values.clientId }}"
  CLIENT_SECRET: "{{ .Values.config.values.clientSecret }}"
  AUTH_TOKEN: "{{ .Values.config.values.authToken }}"
  LOG_LEVEL: "{{ upper (default "INFO" .Values.config.values.logLevel) }}"
  SUBJECT_TAGS: "{{ join "," (default (list) .Values.config.values.subjectTags) }}"
  PROMETHEUS_NAMING_STRICT: "{{ ternary "true" "false" .Values.config.values.prometheusNamingStrict }}"
  {{- with .Values.config.values.additionalSecretValues }}
  {{- toYaml . | nindent 2 }}
  {{- end}}
{{- end }}
