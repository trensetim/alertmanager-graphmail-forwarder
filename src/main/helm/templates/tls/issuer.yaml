{{- if and .Values.tls.enabled .Values.tls.certManager.enabled .Values.tls.certManager.issuer.enabled }}
apiVersion: cert-manager.io/v1
kind: {{ .Values.tls.certManager.issuer.kind }}
metadata:
  name: {{ .Values.tls.certManager.issuer.name | quote }}
  labels:
    {{- toYaml (merge (default dict .Values.tls.certManager.issuer.labels) (default dict .Values.labels)) | nindent 4 }}

  {{- $annotations := merge (default dict .Values.tls.certManager.issuer.annotations) (default dict .Values.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end -}}

{{- "" }}
spec:
  ca:
    secretName: {{ .Values.tls.certManager.issuer.caCertificate.name | quote }}
{{- end }}
