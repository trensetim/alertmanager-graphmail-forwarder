{{- if and
    .Values.tls.enabled
    .Values.tls.certManager.enabled
    .Values.tls.certManager.issuer.enabled
    .Values.tls.certManager.issuer.caCertificate.enabled
    .Values.tls.certManager.issuer.caCertificate.issuer.enabled
}}
{{- with .Values.tls.certManager.issuer.caCertificate.issuer }}
apiVersion: cert-manager.io/v1
kind: {{ .kind }}
metadata:
  name: {{ .name | quote }}
  labels:
    {{- toYaml (merge (default dict .labels) (default dict $.Values.labels)) | nindent 4 }}

  {{- $annotations := merge (default dict .annotations) (default dict $.Values.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end -}}

{{- "" }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
{{- end }}
