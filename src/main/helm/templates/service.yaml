{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "serviceName" . }}
  {{- "" }}
  labels:
    {{- toYaml (merge (default dict .Values.service.labels) (default dict .Values.labels)) | nindent 4 }}

  {{- $annotations := merge (default dict .Values.service.annotations) (default dict .Values.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end -}}

{{- "" }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- $targetPort := ternary "https" "http" .Values.tls.enabled -}}
    {{- if .Values.pod.portOverride -}}
      {{- $targetPort = .Values.pod.portOverride.name -}}
    {{- end -}}
    {{- if .Values.service.portOverride }}
    - name: {{ .Values.service.portOverride.name }}
      port: {{ .Values.service.portOverride.number }}
      targetPort: {{ $targetPort }}
      protocol: TCP
    {{- else }}
    - name: {{ ternary "https" "http" .Values.tls.enabled }}
      port: {{ ternary 443 80 .Values.tls.enabled }}
      targetPort: {{ $targetPort }}
      protocol: TCP
    {{- end }}
  selector:
    {{- if .Values.service.selectorLabels -}}
      {{- toYaml .Values.service.selectorLabels | nindent 6 -}}
    {{- else -}}
      {{- $labels := merge (default dict .Values.pod.labels) (default dict .Values.labels) }}
      {{- toYaml $labels | nindent 6 -}}
    {{- end }}
{{- end }}
